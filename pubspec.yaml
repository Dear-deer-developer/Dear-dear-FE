name: dear_deer_demo
description: "A new Flutter project."
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  smooth_page_indicator: ^1.2.1
  image_picker: ^1.2.0

  cupertino_icons: ^1.0.6
  logger: ^2.5.0
  intl: ^0.20.2
  flutter_screenutil: ^5.9.3
  get: ^4.7.2
  kakao_flutter_sdk: ^1.9.5
  flutter_dotenv: ^6.0.0
  # firebase_core: ^4.1.0
  # firebase_auth: ^6.0.2
  shared_preferences: ^2.2.3
  # cloud_firestore: ^6.0.1
  # cloud_functions: ^6.0.1
  flutter_phoenix: ^1.1.1
  table_calendar: ^3.0.0
  audio_session: ^0.2.2
  just_audio: 0.10.5
  timezone: ^0.10.1
  # firebase_messaging: ^16.0.2
  dio: ^5.9.0
  share_plus: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
    - .env

  fonts:
    - family: LeeSeoyun
      fonts:
        - asset: assets/fonts/LeeSeoyun.ttf

    - family: KakaoSmallSansBold
      fonts:
        - asset: assets/fonts/KakaoSmallSans-Bold.ttf

    - family: KakaoSmallSansRegular
      fonts:
        - asset: assets/fonts/KakaoSmallSans-Regular.ttf

    - family: KakaoSmallSansLight
      fonts:
        - asset: assets/fonts/KakaoSmallSans-Light.ttf

    - family: KakaoBigSansBold
      fonts:
        - asset: assets/fonts/KakaoBigSans-Bold.ttf

    - family: KakaoBigSansExtraBold
      fonts:
        - asset: assets/fonts/KakaoBigSans-ExtraBold.ttf

    - family: KakaoBigSansRegular
      fonts:
        - asset: assets/fonts/KakaoBigSans-Regular.ttf
